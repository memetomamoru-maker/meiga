<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>名画収集館 — 世界の名画を、ひたすら浴びる。</title>
<meta name="description" content="パブリックドメインの名画をスワイプして「浴びる」体験。メトロポリタン美術館・シカゴ美術館などのCC0作品を収録。">
<meta name="theme-color" content="#f5f0e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="名画収集館">
<meta property="og:title" content="名画収集館 — 世界の名画を、ひたすら浴びる。">
<meta property="og:description" content="パブリックドメインの名画をスワイプして「浴びる」体験。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://meiga.vercel.app/">
<link rel="icon" href="./icon.png" type="image/png">
<link rel="apple-touch-icon" href="./icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --cream:  #f5f0e8;
  --warm:   #ede4d3;
  --stone:  #e2d8c8;
  --gold:   #b8956a;
  --gold-l: #d4b896;
  --gold-d: #8a6a3a;
  --ink:    #2a2016;
  --ink-m:  #7a6550;
  --ink-l:  #b0997e;
  --fd:     #4a2e10;
  --fm:     #7a5420;
  --fl:     #c8a060;
  --dur:    .5s;
  --ease:   cubic-bezier(.76, 0, .24, 1);
}

html, body { width: 100%; height: 100%; overflow: hidden; background: #e8e0d0; }
body { font-family: 'Cormorant Garamond', 'Noto Serif JP', Georgia, serif; }

#app {
  position: fixed; inset: 0;
  background: var(--cream);
  overflow: hidden;
  display: flex; flex-direction: column;
  max-width: 480px; margin: 0 auto;
  box-shadow: 0 0 80px rgba(0,0,0,.12);
}

/* 壁テクスチャ */
#app::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background:
    repeating-linear-gradient(0deg,   transparent, transparent 39px, rgba(180,150,100,.05) 39px, rgba(180,150,100,.05) 40px),
    repeating-linear-gradient(90deg,  transparent, transparent 39px, rgba(180,150,100,.03) 39px, rgba(180,150,100,.03) 40px);
}

/* ── ヘッダー ─────────────────────────────────────── */
#hd {
  position: relative; z-index: 300;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px 10px;
  border-bottom: 1px solid rgba(184,149,106,.2);
  background: rgba(245,240,232,.97);
  backdrop-filter: blur(8px);
  flex-shrink: 0;
}
.logo { font-size: 11px; letter-spacing: .22em; color: var(--ink-m); font-style: italic; font-weight: 300; }
.logo b { color: var(--gold-d); font-weight: 400; font-style: normal; }
.hd-r { display: flex; gap: 6px; align-items: center; }
.hbtn {
  height: 28px; padding: 0 10px;
  background: transparent; border: 1px solid rgba(184,149,106,.3);
  color: var(--ink-m); font-family: 'Cormorant Garamond', serif;
  font-size: 11px; letter-spacing: .1em;
  cursor: pointer; transition: all .16s;
  display: flex; align-items: center; gap: 4px; white-space: nowrap;
}
.hbtn:hover, .hbtn:active { background: rgba(184,149,106,.12); border-color: var(--gold); }
.hbtn-r { width: 28px; height: 28px; padding: 0; border-radius: 50%; justify-content: center; font-size: 13px; position: relative; }
.bdg {
  position: absolute; top: -4px; right: -4px;
  min-width: 14px; height: 14px;
  background: var(--gold); border-radius: 7px;
  font-size: 7px; color: #fff;
  display: none; align-items: center; justify-content: center;
  font-family: sans-serif; padding: 0 3px;
}
.bdg.on { display: flex; }

/* ── デッキ ──────────────────────────────────────── */
#dw {
  position: relative; flex: 1; overflow: hidden;
  touch-action: none;
  background: var(--warm);
}

/* ── カード ──────────────────────────────────────── */
.card {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  will-change: transform, opacity;
  transform: translateY(110%);
  transition: transform var(--dur) var(--ease), opacity calc(var(--dur) * .7) ease;
  opacity: 0;
  padding: 0;
  cursor: grab;
}
.card:active { cursor: grabbing; }
.card.cur   { transform: translateY(0); opacity: 1; }
.card.above { transform: translateY(-110%); opacity: 0; }
.card.drag  { transition: none; }

/* 釘 */
.nail {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  background: radial-gradient(circle at 35% 32%, #d8d8d8, #909090 50%, #606060);
  box-shadow: 0 1px 4px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.4);
  z-index: 2; position: relative;
}
/* ひも */
.wire {
  width: 70px; height: 18px; flex-shrink: 0;
  border-top: 1.5px solid rgba(90,55,20,.32);
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  margin-bottom: -1px; z-index: 1;
}

/* 額縁 */
.frame-wrap {
  position: relative; flex-shrink: 0;
  width: min(300px, calc(100vw - 40px));
  max-height: calc(100% - 60px);
}
.frame-wrap::before {
  content: ''; position: absolute; inset: -13px;
  background: linear-gradient(145deg,
    var(--fl) 0%, #a07838 18%, var(--fm) 30%,
    var(--fd) 45%, #6a4418 55%,
    var(--fm) 70%, #b08840 82%, var(--fl) 100%);
  border-radius: 2px;
  box-shadow:
    0 8px 30px rgba(30,18,6,.28),
    0 2px 8px  rgba(30,18,6,.18),
    inset 0 1px 0 rgba(255,255,255,.22);
}
.frame-wrap::after {
  content: ''; position: absolute; inset: -3px;
  background: var(--stone);
  box-shadow: inset 0 0 0 1px rgba(184,149,106,.25), inset 0 0 8px rgba(0,0,0,.06);
}

/* 絵画画像 */
.painting-img {
  display: block; position: relative; z-index: 1;
  width: 100%; height: auto;
  max-height: calc(100vh - 200px);
  object-fit: contain;
  opacity: 0; transition: opacity .6s ease;
}
.painting-img.loaded { opacity: 1; }

/* 読み込み中プレースホルダー */
.painting-placeholder {
  position: relative; z-index: 1;
  width: 100%; aspect-ratio: 3/4;
  display: flex; align-items: center; justify-content: center;
  background: var(--warm); flex-direction: column; gap: 8px;
}
.ph-spinner {
  width: 24px; height: 24px;
  border: 1.5px solid rgba(184,149,106,.25);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.ph-title { font-size: 11px; color: var(--ink-l); font-style: italic; letter-spacing: .08em; text-align: center; padding: 0 8px; }

/* 壁への影 */
.frame-shadow {
  position: absolute; bottom: -20px; left: -5%; width: 110%; height: 20px;
  background: radial-gradient(ellipse at 50% 0%, rgba(30,18,6,.2), transparent 70%);
  filter: blur(6px);
  pointer-events: none; z-index: 0;
}

/* バッジ類 */
.card-num {
  position: absolute; top: 8px; left: 14px; z-index: 10;
  font-size: 9px; letter-spacing: .15em; color: var(--ink-l); font-style: italic;
}
.style-tag {
  position: absolute; top: 8px; right: 14px; z-index: 10;
  font-size: 9px; letter-spacing: .1em; color: var(--ink-m);
  border: 1px solid rgba(184,149,106,.3); padding: 2px 8px;
  background: rgba(245,240,232,.88); backdrop-filter: blur(4px);
}

/* スワイプヒント */
#shi {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 4px;
  pointer-events: none; opacity: 0;
  animation: shia 3.5s ease 1.5s 1 forwards;
}
@keyframes shia {
  0%  { opacity: 0; transform: translateX(-50%) translateY(0); }
  15% { opacity: .5; }
  72% { opacity: .5; transform: translateX(-50%) translateY(-8px); }
  100%{ opacity: 0; transform: translateX(-50%) translateY(-16px); }
}
.shi-l { width: 1px; height: 18px; background: linear-gradient(to top, var(--gold-l), transparent); }
.shi-t { font-size: 8px; letter-spacing: .3em; color: var(--ink-l); font-style: italic; }

/* ── アクションバー ────────────────────────────────── */
#ab {
  position: relative; z-index: 200;
  background: rgba(245,240,232,.98);
  border-top: 1px solid rgba(184,149,106,.18);
  flex-shrink: 0;
}
.ab-i { display: flex; align-items: center; padding: 8px 14px 14px; gap: 10px; }
.ab-info { flex: 1; min-width: 0; }
.ab-t { font-size: 14px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .02em; }
.ab-s { font-size: 10px; color: var(--ink-l); margin-top: 2px; font-style: italic; letter-spacing: .07em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ab-btns { display: flex; gap: 6px; flex-shrink: 0; }
.sbtn {
  height: 32px; padding: 0 10px; background: transparent;
  border: 1px solid rgba(184,149,106,.32); color: var(--ink-m);
  font-family: 'Cormorant Garamond', serif; font-size: 11px; letter-spacing: .08em;
  cursor: pointer; transition: all .16s; white-space: nowrap;
}
.sbtn:hover { background: rgba(184,149,106,.1); }
.hrtbtn {
  width: 32px; height: 32px; border-radius: 50%;
  background: transparent; border: 1px solid rgba(184,149,106,.32); color: var(--ink-l);
  cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s;
}
.hrtbtn:hover { border-color: var(--gold); color: var(--gold); }
.hrtbtn.lk { background: rgba(180,70,70,.07); border-color: rgba(180,70,70,.42); color: rgba(180,70,70,.9); }
.hrtbtn.lk #hico { fill: rgba(180,70,70,.9); stroke: rgba(180,70,70,.9); }
@keyframes hb {
  0%  { transform: scale(1);    }
  20% { transform: scale(1.35); }
  40% { transform: scale(.9);   }
  60% { transform: scale(1.12); }
  100%{ transform: scale(1);    }
}
.hrtbtn.bt #hico { animation: hb .42s ease forwards; }

/* ── トースト ──────────────────────────────────────── */
#toast {
  position: absolute; bottom: 72px; left: 50%; transform: translateX(-50%);
  z-index: 500;
  background: var(--ink); color: var(--cream);
  font-size: 11px; letter-spacing: .1em; padding: 7px 16px;
  white-space: nowrap; pointer-events: none; opacity: 0;
}
@keyframes tf {
  0%  { opacity: 0; transform: translateX(-50%) translateY(5px);  }
  15% { opacity: 1; }
  80% { opacity: 1; }
  100%{ opacity: 0; transform: translateX(-50%) translateY(-4px); }
}
#toast.show { animation: tf 1.8s ease forwards; }

/* ── フィルタードロワー ──────────────────────────────── */
#fd { position: absolute; inset: 0; z-index: 600; pointer-events: none; }
#fd.open { pointer-events: all; }
#fdb { position: absolute; inset: 0; background: rgba(42,32,22,.28); opacity: 0; transition: opacity .28s; }
#fd.open #fdb { opacity: 1; }
#fdp {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(268px, 83vw);
  background: var(--cream); border-left: 1px solid rgba(184,149,106,.2);
  transform: translateX(100%); transition: transform .38s var(--ease);
  display: flex; flex-direction: column; overflow: hidden;
}
#fd.open #fdp { transform: translateX(0); }
.fdh { padding: 16px 18px 13px; border-bottom: 1px solid rgba(184,149,106,.15); font-size: 10px; letter-spacing: .22em; color: var(--ink-m); font-style: italic; flex-shrink: 0; }
.fdbody { flex: 1; overflow-y: auto; padding: 14px 18px 36px; }
.fds { margin-bottom: 18px; }
.fdl {
  font-size: 9px; letter-spacing: .22em; color: var(--gold-d);
  text-transform: uppercase; margin-bottom: 8px;
  display: flex; align-items: center; gap: 7px;
}
.fdl::after { content: ''; flex: 1; height: 1px; background: rgba(184,149,106,.2); }
.pw { display: flex; flex-wrap: wrap; gap: 5px; }
.pill {
  background: transparent; border: 1px solid rgba(184,149,106,.26); color: var(--ink-m);
  font-family: 'Cormorant Garamond', serif; font-size: 11px; padding: 4px 10px;
  cursor: pointer; transition: all .13s; letter-spacing: .05em;
}
.pill:hover { border-color: var(--gold); }
.pill.on { background: var(--gold); color: #fff; border-color: var(--gold); }
.fd-cnt { font-size: 10px; color: var(--ink-l); font-style: italic; margin-bottom: 14px; letter-spacing: .05em; }

/* ── ギャラリー ────────────────────────────────────── */
#gp {
  position: absolute; inset: 0; z-index: 600;
  background: var(--cream);
  transform: translateY(100%); transition: transform .42s var(--ease);
  display: flex; flex-direction: column; overflow: hidden;
}
#gp.open { transform: translateY(0); }
.gph { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; border-bottom: 1px solid rgba(184,149,106,.18); flex-shrink: 0; }
.gpt { font-size: 13px; letter-spacing: .2em; color: var(--ink-m); font-style: italic; }
.gpc { background: transparent; border: 1px solid rgba(184,149,106,.26); color: var(--ink-m); font-size: 11px; width: 28px; height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.gpb { flex: 1; overflow-y: auto; padding: 18px 14px; }
.gwall {
  background:
    repeating-linear-gradient(0deg,  transparent, transparent 59px, rgba(184,149,106,.06) 59px, rgba(184,149,106,.06) 60px),
    repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(184,149,106,.06) 59px, rgba(184,149,106,.06) 60px);
  background-color: var(--warm);
  border: 1px solid rgba(184,149,106,.15);
  min-height: 180px; padding: 28px 14px 20px;
}
.gg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.gi { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.giwire { width: 36px; height: 12px; border-top: 1px solid rgba(90,55,20,.28); border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
.gif { position: relative; width: 100%; aspect-ratio: 3/4; overflow: hidden; }
.gif::before {
  content: ''; position: absolute; inset: -4px;
  background: linear-gradient(140deg, var(--fl) 0%, var(--fm) 30%, var(--fd) 50%, var(--fm) 70%, var(--fl) 100%);
  box-shadow: 1px 3px 8px rgba(30,18,6,.18);
}
.gif img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; display: block; }
.gilbl { font-size: 8px; color: var(--ink-l); font-style: italic; letter-spacing: .04em; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; padding: 0 2px; }
.ge { text-align: center; padding: 52px 0; font-style: italic; font-size: 12px; color: var(--ink-l); letter-spacing: .1em; line-height: 2.4; }
</style>
</head>
<body>
<div id="app">

  <!-- ヘッダー -->
  <div id="hd">
    <div class="logo">名画収集館 <b>·</b> MEIGA</div>
    <div class="hd-r">
      <button class="hbtn" id="btn-filter">≡&nbsp;カテゴリ</button>
      <button class="hbtn hbtn-r" id="btn-gal">🖼<span class="bdg" id="bdg"></span></button>
    </div>
  </div>

  <!-- デッキ（カードが積まれるエリア） -->
  <div id="dw">
    <div id="shi"><div class="shi-l"></div><div class="shi-t">上にスワイプ</div></div>
  </div>

  <!-- アクションバー -->
  <div id="ab">
    <div class="ab-i">
      <div class="ab-info">
        <div class="ab-t" id="abt">—</div>
        <div class="ab-s" id="abs">—</div>
      </div>
      <div class="ab-btns">
        <button class="sbtn" id="btn-share">𝕏 シェア</button>
        <button class="hrtbtn" id="bh">
          <svg id="hico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- フィルタードロワー -->
  <div id="fd">
    <div id="fdb"></div>
    <div id="fdp">
      <div class="fdh">— カテゴリで絞り込む —</div>
      <div class="fdbody" id="fdbody"></div>
    </div>
  </div>

  <!-- ギャラリー -->
  <div id="gp">
    <div class="gph">
      <div class="gpt">My Gallery</div>
      <button class="gpc" id="gpc">✕</button>
    </div>
    <div class="gpb">
      <div class="gwall">
        <div id="gg" class="gg"></div>
        <div id="ge" class="ge">♡ した絵画がここに飾られます</div>
      </div>
    </div>
  </div>

</div>

<!-- 作品データ（増やすときはここだけ編集） -->
<script src="./paintings.js"></script>
<!-- アプリロジック -->
<script src="./app.js"></script>
</body>
</html>

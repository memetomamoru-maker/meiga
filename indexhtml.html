
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --cream:#f5f0e8;--warm:#ede4d3;--stone:#e2d8c8;
  --gold:#b8956a;--gold-l:#d4b896;--gold-d:#8a6a3a;
  --ink:#2a2016;--ink-m:#7a6550;--ink-l:#b0997e;
  --fd:#4a2e10;--fm:#7a5420;--fl:#c8a060;
  --dur:.5s;--ease:cubic-bezier(.76,0,.24,1);
}
body{background:var(--cream);overflow:hidden;font-family:'Cormorant Garamond',Georgia,serif;}

#app{
  position:relative;width:100%;height:640px;
  background:var(--cream);overflow:hidden;
  display:flex;flex-direction:column;
}
/* 壁テクスチャ */
#app::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(180,150,100,.06) 39px,rgba(180,150,100,.06) 40px),
    repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(180,150,100,.04) 39px,rgba(180,150,100,.04) 40px);
}

/* ── ヘッダー ── */
#hd{
  position:relative;z-index:300;
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 16px 9px;
  border-bottom:1px solid rgba(184,149,106,.2);
  background:rgba(245,240,232,.96);
  backdrop-filter:blur(8px);
  flex-shrink:0;
}
.logo{font-size:11px;letter-spacing:.22em;color:var(--ink-m);font-style:italic;font-weight:300;}
.logo b{color:var(--gold-d);font-weight:400;font-style:normal;letter-spacing:.05em;}
.hd-r{display:flex;gap:6px;align-items:center;}

.hbtn{
  height:28px;padding:0 10px;
  background:transparent;border:1px solid rgba(184,149,106,.3);
  color:var(--ink-m);font-family:'Cormorant Garamond',serif;
  font-size:11px;letter-spacing:.1em;cursor:pointer;
  transition:all .16s;display:flex;align-items:center;gap:4px;white-space:nowrap;
}
.hbtn:hover{background:rgba(184,149,106,.1);border-color:var(--gold);}
.hbtn-round{width:28px;height:28px;padding:0;border-radius:50%;justify-content:center;font-size:13px;position:relative;}
.bdg{
  position:absolute;top:-4px;right:-4px;min-width:14px;height:14px;
  background:var(--gold);border-radius:7px;font-size:7px;color:#fff;
  display:none;align-items:center;justify-content:center;font-family:sans-serif;padding:0 3px;
}
.bdg.on{display:flex;}

/* ── デッキ（メイン表示エリア） ── */
#dw{
  position:relative;flex:1;overflow:hidden;touch-action:none;
  /* 壁の背景色 */
  background:var(--warm);
}

/* ── カード ── */
.card{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  will-change:transform,opacity;
  transform:translateY(110%);
  transition:transform var(--dur) var(--ease), opacity calc(var(--dur)*.7) ease;
  opacity:0;
  padding:0;
}
.card.cur{transform:translateY(0);opacity:1;}
.card.above{transform:translateY(-110%);opacity:0;}
.card.drag{transition:none;}

/* 釘 */
.nail{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 35% 32%,#d8d8d8 0%,#909090 50%,#606060 100%);
  box-shadow:0 1px 4px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4);
  z-index:2;position:relative;
}
/* ひも */
.wire{
  width:70px;height:18px;flex-shrink:0;
  border-top:1.5px solid rgba(90,55,20,.32);
  border-radius:50% 50% 0 0/100% 100% 0 0;
  margin-bottom:-1px;position:relative;z-index:1;
}

/* 額縁ラッパー */
.frame-wrap{
  position:relative;flex-shrink:0;
  /* カードの高さに対して最大幅を計算 */
  width:min(300px, calc(100vw - 40px));
}
/* 木製額縁（外） */
.frame-wrap::before{
  content:'';position:absolute;
  inset:-13px;
  background:linear-gradient(145deg,
    var(--fl) 0%,#a07838 18%,var(--fm) 30%,
    var(--fd) 45%,#6a4418 55%,
    var(--fm) 70%,#b08840 82%,var(--fl) 100%);
  border-radius:2px;
  box-shadow:
    0 8px 30px rgba(30,18,6,.28),
    0 2px 8px rgba(30,18,6,.18),
    inset 0 1px 0 rgba(255,255,255,.22),
    inset 0 -1px 0 rgba(0,0,0,.15);
}
/* マット（内側の白いパス）  */
.frame-wrap::after{
  content:'';position:absolute;
  inset:-3px;
  background:var(--stone);
  box-shadow:inset 0 0 0 1px rgba(184,149,106,.25),inset 0 0 8px rgba(0,0,0,.06);
}

/* 絵画本体（CSS描画） */
.painting{
  position:relative;z-index:1;
  width:100%;
  /* アスペクト比は各作品のdata属性で上書き */
  display:block;overflow:hidden;
}

/* 壁への影 */
.frame-shadow{
  position:absolute;bottom:-20px;left:-5%;width:110%;height:20px;
  background:radial-gradient(ellipse at 50% 0%,rgba(30,18,6,.2) 0%,transparent 70%);
  filter:blur(6px);
  pointer-events:none;z-index:0;
}

/* カード上のメタ情報バッジ */
.card-num{
  position:absolute;top:8px;left:14px;z-index:10;
  font-size:9px;letter-spacing:.15em;color:var(--ink-l);font-style:italic;
}
.style-tag{
  position:absolute;top:8px;right:14px;z-index:10;
  font-size:9px;letter-spacing:.1em;color:var(--ink-m);
  border:1px solid rgba(184,149,106,.3);padding:2px 8px;
  background:rgba(245,240,232,.88);backdrop-filter:blur(4px);
}

/* スワイプヒント */
#shi{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  z-index:10;display:flex;flex-direction:column;align-items:center;gap:4px;
  pointer-events:none;opacity:0;
  animation:shia 3.5s ease 1.5s 1 forwards;
}
@keyframes shia{
  0%{opacity:0;transform:translateX(-50%) translateY(0)}
  15%{opacity:.5}72%{opacity:.5;transform:translateX(-50%) translateY(-8px)}
  100%{opacity:0;transform:translateX(-50%) translateY(-16px)}
}
.shi-l{width:1px;height:18px;background:linear-gradient(to top,var(--gold-l),transparent);}
.shi-t{font-size:8px;letter-spacing:.3em;color:var(--ink-l);font-style:italic;}

/* ── アクションバー ── */
#ab{
  position:relative;z-index:200;
  background:rgba(245,240,232,.98);
  border-top:1px solid rgba(184,149,106,.18);
  flex-shrink:0;
}
.ab-i{display:flex;align-items:center;padding:8px 14px 12px;gap:10px;}
.ab-info{flex:1;min-width:0;}
.ab-t{font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em;}
.ab-s{font-size:10px;color:var(--ink-l);margin-top:2px;font-style:italic;letter-spacing:.07em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ab-btns{display:flex;gap:6px;flex-shrink:0;}
.sbtn{
  height:32px;padding:0 10px;background:transparent;
  border:1px solid rgba(184,149,106,.32);color:var(--ink-m);
  font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.08em;
  cursor:pointer;transition:all .16s;white-space:nowrap;
}
.sbtn:hover{background:rgba(184,149,106,.1);}
.hrtbtn{
  width:32px;height:32px;border-radius:50%;background:transparent;
  border:1px solid rgba(184,149,106,.32);color:var(--ink-l);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.hrtbtn:hover{border-color:var(--gold);color:var(--gold);}
.hrtbtn.lk{background:rgba(180,70,70,.07);border-color:rgba(180,70,70,.42);color:rgba(180,70,70,.9);}
.hrtbtn.lk #hico{fill:rgba(180,70,70,.9);stroke:rgba(180,70,70,.9);}
@keyframes hb{0%{transform:scale(1)}20%{transform:scale(1.35)}40%{transform:scale(.9)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.hrtbtn.bt #hico{animation:hb .42s ease forwards;}

/* ── トースト ── */
#toast{
  position:absolute;bottom:68px;left:50%;transform:translateX(-50%);z-index:500;
  background:var(--ink);color:var(--cream);font-size:11px;letter-spacing:.1em;
  padding:7px 16px;white-space:nowrap;pointer-events:none;opacity:0;
}
@keyframes tf{0%{opacity:0;transform:translateX(-50%) translateY(5px)}15%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-4px)}}
#toast.show{animation:tf 1.8s ease forwards;}

/* ── フィルタードロワー ── */
#fd{position:absolute;inset:0;z-index:600;pointer-events:none;}
#fd.open{pointer-events:all;}
#fdb{position:absolute;inset:0;background:rgba(42,32,22,.28);opacity:0;transition:opacity .28s;}
#fd.open #fdb{opacity:1;}
#fdp{
  position:absolute;top:0;right:0;bottom:0;width:min(268px,83vw);
  background:var(--cream);border-left:1px solid rgba(184,149,106,.2);
  transform:translateX(100%);transition:transform .38s var(--ease);
  display:flex;flex-direction:column;overflow:hidden;
}
#fd.open #fdp{transform:translateX(0);}
.fdh{padding:16px 18px 13px;border-bottom:1px solid rgba(184,149,106,.15);font-size:10px;letter-spacing:.22em;color:var(--ink-m);font-style:italic;flex-shrink:0;}
.fdbody{flex:1;overflow-y:auto;padding:14px 18px 36px;}
.fds{margin-bottom:18px;}
.fdl{font-size:9px;letter-spacing:.22em;color:var(--gold-d);text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:7px;}
.fdl::after{content:'';flex:1;height:1px;background:rgba(184,149,106,.2);}
.pw{display:flex;flex-wrap:wrap;gap:5px;}
.pill{
  background:transparent;border:1px solid rgba(184,149,106,.26);color:var(--ink-m);
  font-family:'Cormorant Garamond',serif;font-size:11px;padding:4px 10px;
  cursor:pointer;transition:all .13s;letter-spacing:.05em;
}
.pill:hover{border-color:var(--gold);}
.pill.on{background:var(--gold);color:#fff;border-color:var(--gold);}
.fd-cnt{font-size:10px;color:var(--ink-l);font-style:italic;margin-bottom:14px;letter-spacing:.05em;}

/* ── ギャラリー ── */
#gp{position:absolute;inset:0;z-index:600;background:var(--cream);transform:translateY(100%);transition:transform .42s var(--ease);display:flex;flex-direction:column;overflow:hidden;}
#gp.open{transform:translateY(0);}
.gph{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid rgba(184,149,106,.18);flex-shrink:0;}
.gpt{font-size:13px;letter-spacing:.2em;color:var(--ink-m);font-style:italic;}
.gpc{background:transparent;border:1px solid rgba(184,149,106,.26);color:var(--ink-m);font-size:11px;width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.gpb{flex:1;overflow-y:auto;padding:18px 14px;}
.gwall{
  background:
    repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(184,149,106,.06) 59px,rgba(184,149,106,.06) 60px),
    repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(184,149,106,.06) 59px,rgba(184,149,106,.06) 60px);
  background-color:var(--warm);
  border:1px solid rgba(184,149,106,.15);min-height:180px;padding:28px 14px 20px;
}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.gi{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;}
.giwire{width:36px;height:12px;border-top:1px solid rgba(90,55,20,.28);border-radius:50% 50% 0 0/100% 100% 0 0;}
.gif{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;}
.gif::before{content:'';position:absolute;inset:-4px;background:linear-gradient(140deg,var(--fl) 0%,var(--fm) 30%,var(--fd) 50%,var(--fm) 70%,var(--fl) 100%);box-shadow:1px 3px 8px rgba(30,18,6,.18);}
.gif-inner{position:relative;z-index:1;width:100%;height:100%;}
.gilbl{font-size:8px;color:var(--ink-l);font-style:italic;letter-spacing:.04em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;padding:0 2px;}
.ge{text-align:center;padding:52px 0;font-style:italic;font-size:12px;color:var(--ink-l);letter-spacing:.1em;line-height:2.4;}
</style>

// ── SVGで絵画を生成 ──
function makeSvgPainting(p){
  const [numW, numH] = p.ratio.split('/').map(Number);
  const W=200, H=Math.round(W*numH/numW);

  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('width','100%');
  svg.setAttribute('height','100%');
  svg.style.cssText='display:block;';

  // 背景
  const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');
  bg.setAttribute('width',W);bg.setAttribute('height',H);bg.setAttribute('fill',p.bg);
  svg.appendChild(bg);

  // レイヤー描画
  p.layers.forEach(l=>{
    const op=l.op||1;
    if(l.type==='sky'||l.type==='sky2'||l.type==='sky3'){
      const r=rect(0,0,W,H*(l.h||45)/100,l.c,op);svg.appendChild(r);
    } else if(l.type==='land'||l.type==='grass'||l.type==='floor'||l.type==='wall'||l.type==='wall2'){
      const y=l.y?H*l.y/100:H*.5;
      const r=rect(0,y,W,H-y,l.c,op);svg.appendChild(r);
    } else if(l.type==='figure'||l.type==='dancer'||l.type==='vase'||l.type==='vase2'){
      const x=W*l.x/100,y=H*l.y/100,w=W*l.w/100,h=H*l.h/100;
      svg.appendChild(rect(x,y,w,h,l.c,op));
      if(l.c2){// 衣装/装飾ライン
        for(let i=0;i<3;i++){svg.appendChild(rect(x+w*.1+i*w*.2,y+h*.2,w*.15,h*.5,l.c2,.5));}
      }
    } else if(l.type==='oval'||l.type==='oval2'||l.type==='head1'||l.type==='head2'||l.type==='head3'||l.type==='head4'){
      const cx=l.x?W*l.x/100:W*.5,cy=l.y?H*l.y/100:H*.5;
      const rx=l.rx?W*l.rx/100:(l.r?W*l.r/100:W*.15);
      const ry=l.ry?H*l.ry/100:(l.r?H*l.r/100:H*.18);
      svg.appendChild(ellipse(cx,cy,rx,ry,l.c,op));
    } else if(l.type==='pearl'||l.type==='moon'||l.type==='sun-o'){
      const cx=W*l.x/100,cy=H*l.y/100,r=W*l.r/100;
      svg.appendChild(circle(cx,cy,r,l.c,op));
      if(l.type==='moon'){// 光輪
        svg.appendChild(circle(cx,cy,r*2.2,l.c,.12));
      }
    } else if(l.type==='water'||l.type==='water1'||l.type==='water2'||l.type==='water3'||l.type==='water4'||l.type==='water5'){
      const y=l.y?H*l.y/100:H*.5;
      svg.appendChild(rect(0,y,W,H-y,l.c,op));
      // さざ波
      for(let i=0;i<5;i++){
        const e=ellipse(W*(.1+i*.18),y+H*.04,W*.12,H*.015,l.type==='water1'?'#80c0a0':'#4888c0',.2);
        svg.appendChild(e);
      }
    } else if(l.type==='swirl1'||l.type==='swirl2'){
      for(let i=0;i<7;i++){
        const e=ellipse(W*.5,H*(i*.12+.05),W*.4+i*5,H*.06,l.c,.25+i*.03);
        svg.appendChild(e);
      }
    } else if(l.type==='wave1'||l.type==='wave2'){
      for(let i=0;i<5;i++){
        const e=ellipse(W*(i*.22+.1),H*(.3+i*.05),W*.25,H*.18,l.c,.4);
        svg.appendChild(e);
      }
    } else if(l.type==='foam'){
      for(let i=0;i<12;i++){
        const e=ellipse(W*(i*.09+.02),H*(.22+i*.02),W*.06,H*.04,l.c,.6);
        svg.appendChild(e);
      }
    } else if(l.type==='fuji'){
      const pts=`${W*l.x/100},${H} ${W*(l.x+20)/100},${H*.42} ${W*(l.x+30)/100},${H}`;
      const poly=document.createElementNS('http://www.w3.org/2000/svg','polygon');
      poly.setAttribute('points',pts);poly.setAttribute('fill',l.c);
      svg.appendChild(poly);
    } else if(l.type==='fuji2'){
      const pts=`${W*l.x/100},${H*.95} ${W*(l.x+35)/100},${H*l.y/100} ${W*(l.x+60)/100},${H*.95}`;
      const poly=document.createElementNS('http://www.w3.org/2000/svg','polygon');
      poly.setAttribute('points',pts);poly.setAttribute('fill',l.c);svg.appendChild(poly);
      // 山頂の雪
      const pts2=`${W*(l.x+30)/100},${H*l.y/100} ${W*(l.x+20)/100},${H*(l.y+12)/100} ${W*(l.x+40)/100},${H*(l.y+12)/100}`;
      const poly2=document.createElementNS('http://www.w3.org/2000/svg','polygon');
      poly2.setAttribute('points',pts2);poly2.setAttribute('fill','#f8f0e8');svg.appendChild(poly2);
    } else if(l.type==='hill'){
      const e=ellipse(W*.5,H*(l.y/100+.2),W*.7,H*.2,l.c,op);svg.appendChild(e);
    } else if(l.type==='village'){
      for(let i=0;i<8;i++){
        const x=W*(i*.11+.08),y=H*l.y/100;
        svg.appendChild(rect(x,y,W*.04,H*.12,l.c,.9));
        const pts=`${x},${y} ${x+W*.04},${y} ${x+W*.02},${y-H*.04}`;
        const roof=document.createElementNS('http://www.w3.org/2000/svg','polygon');
        roof.setAttribute('points',pts);roof.setAttribute('fill','#0a1020');svg.appendChild(roof);
      }
    } else if(l.type==='cypress'){
      for(let i=0;i<3;i++){
        const x=W*(l.x/100+i*.05),y=H*l.y/100;
        svg.appendChild(rect(x,y,W*.03,H*.35,l.c,.9));
      }
    } else if(l.type==='tree1'){
      const x=W*l.x/100;
      svg.appendChild(rect(x+W*.04,H*.4,W*.02,H*.6,l.c,.9));
      svg.appendChild(ellipse(x+W*.05,H*.25,W*.08,H*.22,l.c,.9));
    } else if(l.type==='bridge'||l.type==='bridge2'){
      const y=l.y?H*l.y/100:H*.6;
      svg.appendChild(rect(0,y,W,H*.08,l.c,op));
    } else if(l.type==='boat1'||l.type==='boat2'){
      const x=W*(l.x||20)/100,y=H*(l.y||70)/100;
      const pts=`${x},${y} ${x+W*.12},${y} ${x+W*.1},${y+H*.04} ${x+W*.02},${y+H*.04}`;
      const poly=document.createElementNS('http://www.w3.org/2000/svg','polygon');
      poly.setAttribute('points',pts);poly.setAttribute('fill',l.c);svg.appendChild(poly);
    } else if(l.type==='arch1'||l.type==='arch2'){
      // アーチ型建築
      for(let i=0;i<5;i++){
        const x=W*(i*.2);
        const path=document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('d',`M${x},${H} L${x},${H*.3} Q${x+W*.1},${H*.1} ${x+W*.2},${H*.3} L${x+W*.2},${H}`);
        path.setAttribute('fill','none');path.setAttribute('stroke',l.c);path.setAttribute('stroke-width','2');path.setAttribute('opacity','0.5');
        svg.appendChild(path);
      }
    } else if(l.type==='steps'){
      for(let i=0;i<4;i++){
        svg.appendChild(rect(W*(i*.03),H*(l.y/100+i*.015),W*(1-i*.06),H*.015,l.c,.7));
      }
    } else if(l.type==='sun1'||l.type==='sun2'||l.type==='sun3'||l.type==='sun4'){
      const cx=W*(l.x||50)/100,cy=H*(l.y||30)/100,r=W*(l.r||12)/100;
      svg.appendChild(circle(cx,cy,r*1.4,l.c,.3));
      svg.appendChild(circle(cx,cy,r,l.c,1));
      // 花びら
      for(let i=0;i<8;i++){
        const a=i*Math.PI/4, px=cx+Math.cos(a)*r*1.8, py=cy+Math.sin(a)*r*1.8;
        svg.appendChild(ellipse(px,py,r*.5,r*.3,l.c,.7));
      }
    } else if(l.type==='flower1'||l.type==='flower2'||l.type==='flower3'||l.type==='flower4'){
      const cx=W*(l.x||50)/100,cy=H*(l.y||50)/100,r=W*.025;
      svg.appendChild(circle(cx,cy,r*1.8,l.c,.5));
      svg.appendChild(circle(cx,cy,r,l.c,1));
    } else if(l.type==='lily1'||l.type==='lily2'||l.type==='lily3'){
      const cx=W*l.x/100,cy=H*l.y/100;
      svg.appendChild(ellipse(cx,cy,W*l.rx/100,H*l.ry/100,l.c,.7));
    } else if(l.type==='rain'||l.type==='rain-lines'){
      for(let i=0;i<20;i++){
        const line=document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1',W*(i*.05+Math.random()*.04));line.setAttribute('y1','0');
        line.setAttribute('x2',W*(i*.05+Math.random()*.04-0.02));line.setAttribute('y2',H+'');
        line.setAttribute('stroke',l.c);line.setAttribute('stroke-width','0.8');line.setAttribute('opacity','0.4');
        svg.appendChild(line);
      }
    } else if(l.type==='gold1'||l.type==='gold2'||l.type==='gold3'||l.type==='gold4'){
      for(let i=0;i<6;i++){
        svg.appendChild(ellipse(W*(i*.18+.05),H*(i*.14+.05),W*.12,H*.1,l.c,.2));
      }
    } else if(l.type==='abstract1'||l.type==='abstract2'||l.type==='abstract3'||l.type==='abstract4'){
      const shapes2=[
        {x:W*.1,y:H*.1,r:W*.12},{x:W*.6,y:H*.3,r:W*.08},
        {x:W*.3,y:H*.6,r:W*.1},{x:W*.75,y:H*.65,r:W*.06},
      ];
      shapes2.forEach((s,si)=>{
        if(si===parseInt(l.type.slice(-1))-1){
          svg.appendChild(circle(s.x,s.y,s.r,l.c,.7));
          const line=document.createElementNS('http://www.w3.org/2000/svg','line');
          line.setAttribute('x1',s.x);line.setAttribute('y1',s.y);
          line.setAttribute('x2',s.x+W*.2);line.setAttribute('y2',s.y+H*.1);
          line.setAttribute('stroke',l.c);line.setAttribute('stroke-width','2');line.setAttribute('opacity','0.6');
          svg.appendChild(line);
        }
      });
    } else if(l.type==='dawn'){
      for(let i=0;i<5;i++){
        svg.appendChild(rect(0,H*(i*.2),W,H*.2,l.c,(i*.08+.1)));
      }
    } else if(l.type==='sky-red'){
      for(let i=0;i<8;i++){
        svg.appendChild(ellipse(W*(i*.13+.05),H*.15,W*.18,H*.12,l.c,.3+i*.03));
      }
    } else if(l.type==='fjord'){
      svg.appendChild(rect(0,H*.4,W,H*.6,l.c,.7));
    } else if(l.type==='figure2'){
      // 叫びの人物
      const cx=W*l.x/100,cy=H*l.y/100;
      svg.appendChild(ellipse(cx,cy-H*.06,W*.08,H*.08,l.c,.9));
      svg.appendChild(rect(cx-W*.06,cy,W*.12,H*.35,l.c,.7));
      // 手
      svg.appendChild(ellipse(cx-W*.1,cy-H*.04,W*.04,H*.06,l.c,.6));
      svg.appendChild(ellipse(cx+W*.1,cy-H*.04,W*.04,H*.06,l.c,.6));
    } else if(l.type==='forest'||l.type==='forest2'||l.type==='forest3'){
      for(let i=0;i<12;i++){
        const x=W*(i*.09+Math.random()*.04),y=H*(Math.random()*.1);
        svg.appendChild(rect(x,y,W*.015,H*.4,l.c,.5));
        svg.appendChild(ellipse(x+W*.008,y,W*.04,H*.08,l.c,.5));
      }
    } else if(l.type==='grove'){
      for(let i=0;i<8;i++){
        const x=W*(i*.13+.02),y=0;
        svg.appendChild(rect(x+W*.015,y,W*.02,H*.8,l.c,.6));
        svg.appendChild(ellipse(x+W*.025,y,W*.06,H*.15,l.c,.6));
      }
    } else if(l.type==='crowd'||l.type==='crowd2'||l.type==='dot1'){
      for(let i=0;i<25;i++){
        svg.appendChild(circle(W*(Math.random()),H*(.3+Math.random()*.6),W*.015,l.c,.4));
      }
    } else if(l.type==='light1'||l.type==='light2'||l.type==='light3'||l.type==='light4'){
      const cx=l.x?W*l.x/100:W*.5,cy=l.y?H*l.y/100:H*.3;
      const rx=l.rx?W*l.rx/100:(l.r?W*l.r/100:W*.3);
      const ry=l.ry?H*l.ry/100:(l.r?H*l.r/100:H*.35);
      svg.appendChild(ellipse(cx,cy,rx,ry,l.c,l.op||.3));
    } else if(l.type==='dark1'||l.type==='dark2'){
      svg.appendChild(rect(0,0,W,H,l.c,.4));
    } else if(l.type==='gun'){
      const x=W*l.x/100,y=H*l.y/100,w=W*l.w/100,h=H*l.h/100;
      svg.appendChild(rect(x,y,w,h,l.c,.8));
    } else if(l.type==='collar'){
      const x=W*l.x/100,y=H*l.y/100,w=W*l.w/100,h=H*l.h/100;
      svg.appendChild(rect(x,y,w,h,l.c,.85));
    } else if(l.type==='wrap'){
      const x=W*l.x/100,y=H*l.y/100,w=W*l.w/100,h=H*l.h/100;
      svg.appendChild(rect(x,y,w,h,l.c,.7));
    } else if(l.type==='table'){
      svg.appendChild(rect(0,H*l.y/100,W,H-H*l.y/100,l.c,.9));
    } else if(l.type==='window'){
      const x=W*l.x/100,y=H*l.y/100,w=W*l.w/100,h=H*l.h/100;
      svg.appendChild(rect(x,y,w,h,l.c,.5));
      svg.appendChild(rect(x+w*.48,y,w*.04,h,l.c,.4)); // 縦桟
      svg.appendChild(rect(x,y+h*.48,w,h*.04,l.c,.4)); // 横桟
    } else if(l.type==='shell'){
      svg.appendChild(ellipse(W*l.x/100,H*l.y/100,W*l.rx/100,H*l.ry/100,l.c,.7));
    } else if(l.type==='wind'){
      const x=W*l.x/100,y=H*l.y/100,w=W*l.w/100,h=H*l.h/100;
      svg.appendChild(ellipse(x+w*.5,y+h*.5,w*.5,h*.5,l.c,.4));
    }
  });

  // ノイズフィルタ（油絵感）
  const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML=`<filter id="noise${p.id}"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feBlend in="SourceGraphic" mode="overlay" result="blend"/><feComposite in="blend" in2="SourceGraphic" operator="atop"/></filter>`;
  svg.insertBefore(defs,svg.firstChild);
  const noiseRect=rect(0,0,W,H,'transparent',1);
  noiseRect.setAttribute('filter',`url(#noise${p.id})`);noiseRect.setAttribute('opacity','.05');
  svg.appendChild(noiseRect);

  return svg;
}

function rect(x,y,w,h,fill,op=1){
  const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
  r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',w);r.setAttribute('height',h);
  r.setAttribute('fill',fill);r.setAttribute('opacity',op);
  return r;
}
function circle(cx,cy,r,fill,op=1){
  const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',r);
  c.setAttribute('fill',fill);c.setAttribute('opacity',op);
  return c;
}
function ellipse(cx,cy,rx,ry,fill,op=1){
  const e=document.createElementNS('http://www.w3.org/2000/svg','ellipse');
  e.setAttribute('cx',cx);e.setAttribute('cy',cy);e.setAttribute('rx',rx);e.setAttribute('ry',ry);
  e.setAttribute('fill',fill);e.setAttribute('opacity',op);
  return e;
}

// ── カード生成 ──
function makeCard(p,idx,total){
  const card=document.createElement('div');
  card.className='card';card._p=p;

  const num=document.createElement('div');num.className='card-num';num.textContent=`${idx+1} / ${total}`;
  const stag=document.createElement('div');stag.className='style-tag';stag.textContent=p.style;

  const nail=document.createElement('div');nail.className='nail';
  const wire=document.createElement('div');wire.className='wire';

  // アスペクト比からサイズ計算
  const fw=document.createElement('div');fw.className='frame-wrap';
  const [nw,nh]=p.ratio.split('/').map(Number);
  // デッキの高さを元にフレームサイズを計算
  fw.style.aspectRatio=p.ratio;

  const painting=document.createElement('div');painting.className='painting';
  painting.style.aspectRatio=p.ratio;
  const svg=makeSvgPainting(p);
  painting.appendChild(svg);
  fw.appendChild(painting);

  const shadow=document.createElement('div');shadow.className='frame-shadow';

  card.appendChild(num);card.appendChild(stag);
  card.appendChild(nail);card.appendChild(wire);card.appendChild(fw);card.appendChild(shadow);
  return card;
}

function buildQueue(){
  let res=DB.filter(p=>{
    if(filter.century!=='all'&&p.century!==filter.century)return false;
    if(filter.style  !=='all'&&p.style  !==filter.style  )return false;
    if(filter.artist !=='all'&&p.artist !==filter.artist )return false;
    return true;
  });
  if(res.length===0){toast('該当する作品がありません');return false;}
  queue=[...res].sort(()=>Math.random()-.5);
  return true;
}

function clearDeck(){cards.forEach(c=>c.el.remove());cards=[];pointer=0;}

function init(){
  clearDeck();
  if(!buildQueue())return;
  for(let i=0;i<Math.min(3,queue.length);i++){
    const el=makeCard(queue[i],i,queue.length);
    dw.appendChild(el);cards.push({el,data:queue[i]});
  }
  pointer=Math.min(3,queue.length);
  updateStack();
}

function updateStack(){
  cards.forEach(({el},i)=>{
    el.classList.remove('cur','above','drag');
    if(i===0){el.classList.add('cur');el.style.transform='';el.style.opacity='';updateMeta(el._p);}
    else{el.style.transform='translateY(110%)';el.style.opacity='0';el.style.transition='';}
  });
}
function updateMeta(p){
  if(!p)return;
  abt.textContent=p.title;
  abs.textContent=`${p.artist}  ·  ${p.year}  ·  ${p.century}`;
  bh.classList.toggle('lk',liked.some(x=>x.id===p.id));
}

// スワイプ
let isDrag=false,startY=0,diffY=0;
const THRESH=46;
dw.addEventListener('mousedown',e=>start(e.clientY));
dw.addEventListener('touchstart',e=>start(e.touches[0].clientY),{passive:true});
window.addEventListener('mousemove',e=>{if(isDrag)move(e.clientY);});
window.addEventListener('touchmove',e=>{if(isDrag)move(e.touches[0].clientY);},{passive:true});
window.addEventListener('mouseup',end);window.addEventListener('touchend',end);
function start(y){if(!cards.length)return;isDrag=true;startY=y;diffY=0;cards[0].el.classList.add('drag');}
function move(y){
  if(!isDrag||!cards.length)return;
  diffY=y-startY;
  const dy=Math.min(0,diffY);
  cards[0].el.style.transform=`translateY(${dy*.38}px)`;
  if(cards.length>1){
    const prog=Math.min(Math.abs(dy)/(THRESH*1.5),1);
    cards[1].el.style.transition='none';
    cards[1].el.style.transform=`translateY(${(1-prog)*110}%)`;
    cards[1].el.style.opacity=String(prog);
  }
}
function end(){
  if(!isDrag)return;isDrag=false;if(!cards.length)return;
  cards[0].el.classList.remove('drag');cards[0].el.style.transition='';
  if(diffY<-THRESH){goNext();}
  else{
    cards[0].el.style.transform='';
    if(cards.length>1){cards[1].el.style.transition='';cards[1].el.style.transform='translateY(110%)';cards[1].el.style.opacity='0';}
  }
}
function goNext(){
  if(!cards.length)return;
  const cur=cards[0].el;
  cur.style.transition=`transform .5s cubic-bezier(.76,0,.24,1),opacity .38s ease`;
  cur.classList.add('above');
  setTimeout(()=>cur.remove(),560);
  cards.shift();
  if(pointer<queue.length){
    const el=makeCard(queue[pointer],pointer,queue.length);
    dw.appendChild(el);cards.push({el,data:queue[pointer]});pointer++;
  }
  if(cards.length===0){toast('全作品を鑑賞しました。シャッフル中…');setTimeout(()=>init(),1200);return;}
  updateStack();
}
document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key===' ')goNext();});

// ハート
bh.addEventListener('click',()=>{
  if(!cards.length)return;
  const p=cards[0].data;
  const i=liked.findIndex(x=>x.id===p.id);
  if(i>=0){liked.splice(i,1);bh.classList.remove('lk');toast('解除しました');}
  else{
    liked.push(p);bh.classList.add('lk');
    bh.classList.remove('bt');void bh.offsetWidth;bh.classList.add('bt');
    toast('ギャラリーに追加しました');
  }
  save();upBdg();
});

// シェア
document.getElementById('btn-share').addEventListener('click',()=>{
  if(!cards.length)return;
  const p=cards[0].data;
  const t=`「${p.title}」\n${p.artist}（${p.year}）\n\n#名画収集館 #名画 #art`;
  window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(t)}`,'_blank','noopener');
});

// フィルター
const fd=document.getElementById('fd');
document.getElementById('btn-filter').addEventListener('click',()=>{fd.classList.add('open');buildFD();});
document.getElementById('fdb').addEventListener('click',()=>fd.classList.remove('open'));
function buildFD(){
  const body=document.getElementById('fdbody');body.innerHTML='';
  const cnt=DB.filter(p=>{
    if(filter.century!=='all'&&p.century!==filter.century)return false;
    if(filter.style!=='all'&&p.style!==filter.style)return false;
    if(filter.artist!=='all'&&p.artist!==filter.artist)return false;
    return true;
  }).length;
  const cd=document.createElement('div');cd.className='fd-cnt';cd.textContent=`現在 ${cnt} 作品が対象`;
  body.appendChild(cd);
  function sec(label,key,vals){
    const s=document.createElement('div');s.className='fds';
    const l=document.createElement('div');l.className='fdl';l.textContent=label;
    const pw=document.createElement('div');pw.className='pw';
    const all=document.createElement('button');
    all.className='pill'+(filter[key]==='all'?' on':'');all.textContent='すべて';
    all.onclick=()=>{filter[key]='all';init();fd.classList.remove('open');};pw.appendChild(all);
    vals.forEach(v=>{
      const pill=document.createElement('button');
      pill.className='pill'+(filter[key]===v?' on':'');pill.textContent=v;
      pill.onclick=()=>{filter[key]=v;init();fd.classList.remove('open');};pw.appendChild(pill);
    });
    s.appendChild(l);s.appendChild(pw);body.appendChild(s);
  }
  sec('世紀','century',centuries);sec('画派','style',styles);sec('画家','artist',artists);
}

// ギャラリー
const gp=document.getElementById('gp');
document.getElementById('btn-gal').addEventListener('click',()=>{gp.classList.add('open');renderGallery();});
document.getElementById('gpc').addEventListener('click',()=>gp.classList.remove('open'));
function renderGallery(){
  const gg=document.getElementById('gg'),ge=document.getElementById('ge');
  gg.innerHTML='';
  if(liked.length===0){ge.style.display='block';gg.style.display='none';return;}
  ge.style.display='none';gg.style.display='grid';
  liked.forEach(p=>{
    const item=document.createElement('div');item.className='gi';
    const wire=document.createElement('div');wire.className='giwire';
    const frame=document.createElement('div');frame.className='gif';
    const inner=document.createElement('div');inner.className='gif-inner';
    // ミニSVG
    const miniSvg=makeSvgPainting(p);
    inner.appendChild(miniSvg);
    frame.appendChild(inner);
    const lbl=document.createElement('div');lbl.className='gilbl';lbl.textContent=p.title;
    item.appendChild(wire);item.appendChild(frame);item.appendChild(lbl);
    item.title=`${p.title} — ${p.artist} (${p.year})`;
    gg.appendChild(item);
  });
}

init();
})();
</script>

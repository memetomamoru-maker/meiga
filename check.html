<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>画像チェッカー</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; font-size: 13px; background: #f5f0e8; padding: 16px; }
#summary { background: #fff; padding: 12px 16px; margin-bottom: 16px; border-radius: 4px; border: 1px solid #ddd; font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.item { background: #fff; border: 2px solid #ddd; border-radius: 4px; padding: 6px; }
.item.ok { border-color: #4a9a4a; }
.item.ng { border-color: #cc3333; background: #fff0f0; }
.thumb { width: 100%; height: 90px; object-fit: contain; background: #eee; display: block; }
.name { font-size: 10px; margin-top: 4px; color: #444; line-height: 1.3; }
.item.ng .name { color: #cc3333; font-weight: bold; }
.status { font-size: 9px; color: #888; }
.item.ok .status { color: #4a9a4a; }
.item.ng .status { color: #cc3333; }
</style>
</head>
<body>
<div id="summary">読み込み中... <span id="prog"></span></div>
<div class="grid" id="grid"></div>
<script src="./paintings.js"></script>
<script>
let ok = 0, ng = 0, done = 0;
const total = PAINTINGS.length;
const grid = document.getElementById('grid');
const summary = document.getElementById('summary');

function updateSummary() {
  summary.innerHTML = `
    全${total}件中 ${done}件チェック完了 ／
    <span style="color:#4a9a4a">✓ 表示OK: ${ok}件</span> ／
    <span style="color:#cc3333">✗ 表示NG: ${ng}件</span>
    ${done < total ? '（チェック中...）' : '　← 完了！'}
  `;
}

PAINTINGS.forEach(p => {
  const item = document.createElement('div');
  item.className = 'item';

  const img = document.createElement('img');
  img.className = 'thumb';
  img.alt = p.title;

  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = `#${p.id} ${p.title}`;

  const status = document.createElement('div');
  status.className = 'status';
  status.textContent = '読み込み中...';

  img.onload = () => {
    item.classList.add('ok');
    status.textContent = '✓ OK';
    ok++; done++;
    updateSummary();
  };
  img.onerror = () => {
    item.classList.add('ng');
    status.textContent = '✗ NG（表示不可）';
    img.style.display = 'none';
    ng++; done++;
    updateSummary();
  };

  // 画像セットは最後（onload/onerrorの後）
  img.src = p.image;

  item.appendChild(img);
  item.appendChild(name);
  item.appendChild(status);
  grid.appendChild(item);
});

updateSummary();
</script>
</body>
</html>
